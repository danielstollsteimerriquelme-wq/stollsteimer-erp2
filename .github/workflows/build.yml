name: Compilar Stollsteimer ERP Portable

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js (v18)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install

      - name: Compilar ejecutable portable
        run: npm run dist

      - name: Subir ejecutable compilado
        uses: actions/upload-artifact@v4
        with:
          name: Stollsteimer-ERP-Portable
          path: release/*.exe
